:root{
  --bg:#f7f5f0; --card:#fffdf8; --ink:#1b1a17; --mut:#6b665c;

}
[data-theme="dark"]{
  --bg:#161514; --card:#1f1d1b; --ink:#ece7dc; --mut:#a49d90;
  --line:#332f29; --acc:#5cc9c4; --acc2:#e0a458; --soft:#26231f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 64px}
header{padding:14px 0 6px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:.02em}
.sub{color:var(--mut);font-size:13px;margin:0}
.top{display:flex;gap:8px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.searchbox{position:relative;margin:14px 0 6px}
#q{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:15px;outline:none}
#q:focus{border-color:var(--acc)}
#clear{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--mut);
  font-size:18px;cursor:pointer;display:none;padding:4px 8px}
.hint{font-size:12px;color:var(--mut);margin:4px 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.mods{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.mods::-webkit-scrollbar{display:none}
.modbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.modbtn span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.modbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.modbtn.on span{color:rgba(255,255,255,.75)}
.mhead{margin:18px 0 4px;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 10px 10px 0}
.mhead h2{font-size:18px;margin:0}
.mhead span{float:right;font-size:12px;color:var(--mut)}
.mhead p{margin:6px 0 0;font-size:13px;color:var(--mut)}
.relnote{display:block;font-size:12px;color:var(--acc2);margin-top:3px}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--mut);
  border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:12px 0}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 0}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--mut);font-size:13px}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.card a.open{display:inline-block;margin-top:10px;color:var(--acc);font-size:13px;text-decoration:none;font-weight:600}
.chap{margin:22px 0 6px;display:flex;align-items:baseline;gap:8px}
.chap h2{font-size:17px;margin:0}
.chap span{font-size:12px;color:var(--mut)}
.cdesc{font-size:13px;color:var(--mut);margin:0 0 8px}
.sec{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin:8px 0;position:relative}
.sec:hover{border-color:var(--acc)}
.sec .no{font-size:12px;color:var(--acc2);font-weight:700;margin-right:8px}
.sec .t{font-size:14px}
.sec .from{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.sec .ok{position:absolute;right:10px;top:10px;font-size:12px;color:var(--acc)}
.empty{color:var(--mut);font-size:13px;padding:18px 0}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}

<script>

        var box = document.createElement('div');
        var head = document.createElement('div');
        head.className = 'chap';
        head.innerHTML = '<h2>'+L.title+'</h2><span>'+items.length+' 节</span>';
        box.appendChild(head);
        var d = document.createElement('p'); d.className='cdesc'; d.textContent=L.desc; box.appendChild(d);
        items.forEach(function(it){ hits++; box.appendChild(row(it)); });
        list.appendChild(box);
      });
    }
    if(!hits){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = kw ? '没有匹配「'+q.value+'」的内容，试试“级数”“隐函数”“格林”“极限”。' : '这个模块暂无内容。';
      list.appendChild(e);
    }
    hint.textContent = kw ? ('匹配 '+hits+' 节')
      : (curMod === 'p' ? '按整卷与专题分组；点“关联 n 节”可到知识点，也可从课程页的“对应知识点”跳回。'
        : '知识精讲按五章排列；每题在课程页里标了对应知识点。');
  }

  q.addEventListener('input', function(){
    $('clear').style.display = q.value ? 'block' : 'none';
    if(q.value){
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(x){ x.classList.toggle('on', x.getAttribute('data-ch') === 'all'); });
      curCh = 'all';
    }
    renderList();
  });
  $('clear').addEventListener('click', function(){ q.value=''; $('clear').style.display='none'; renderList(); q.focus(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ q.value=''; $('clear').style.display='none'; renderList(); } });

  Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      curCh = t.getAttribute('data-ch');
      renderList();
    });
  });

  // 进度
  $('allbar').style.width = (totalSec? Math.round(totalDone/totalSec*100):0) + '%';
  $('alltxt').textContent = totalDone + ' / ' + totalSec + ' 节（' + (totalSec? Math.round(totalDone/totalSec*100):0) + '%）';

  // 主题
  var th = $('theme');
  try{ if(localStorage.getItem('mc.theme') === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); th.textContent='浅色'; } }catch(e){}
  th.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    th.textContent = dark ? '深色' : '浅色';
    try{ localStorage.setItem('mc.theme', dark ? 'light' : 'dark'); }catch(e){}
  });

  renderCards();
  renderList();
})();

</script>
<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
