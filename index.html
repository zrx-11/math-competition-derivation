            if(hay.indexOf(kw) < 0) return;
          }
          items.push({L: L, s: s});
        });
      });
      if(!items.length) return;
      var head = document.createElement('div');
      head.className = 'chap';
      head.innerHTML = '<h2>'+C.name+'</h2><span>'+items.length+' 节</span>';
      box.appendChild(head);
      var d = document.createElement('p');
      d.className = 'cdesc';
      d.textContent = C.desc;
      box.appendChild(d);
      items.forEach(function(it){
        hits++;
        var a = document.createElement('a');
        a.className = 'sec';
        a.href = it.L.file + '#' + it.s.id;
        a.innerHTML = '<span class="no">'+it.s.no+'</span><span class="t">'+it.s.title+'</span>'+
          '<span class="from">'+it.L.title+'</span>'+
          (it.s.done ? '<span class="ok">已学</span>' : '');
        box.appendChild(a);
      });
      list.appendChild(box);
    });
    if(!hits){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = kw ? '没有匹配「'+q.value+'」的章节，试试“级数”“隐函数”“格林”。' : '这一章暂无内容。';
      list.appendChild(e);
    }
    if(kw) hint.textContent = '匹配 '+hits+' 节';
  }

  q.addEventListener('input', function(){
    $('clear').style.display = q.value ? 'block' : 'none';
    if(q.value){
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(x){ x.classList.toggle('on', x.getAttribute('data-ch') === 'all'); });
      curCh = 'all';
    }
    render();
  });
  $('clear').addEventListener('click', function(){ q.value=''; $('clear').style.display='none'; render(); q.focus(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ q.value=''; $('clear').style.display='none'; render(); } });

  Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){
      Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      curCh = t.getAttribute('data-ch');
      render();
    });
  });

  // 主题
  var th = $('theme');
  try{ if(localStorage.getItem('mc.theme') === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); th.textContent='浅色'; } }catch(e){}
  th.addEventListener('click', function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    th.textContent = dark ? '深色' : '浅色';
    try{ localStorage.setItem('mc.theme', dark ? 'light' : 'dark'); }catch(e){}
  });

  render();
})();
</script>
</body>
</html>
